<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grunderna i CSS-animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Grunderna i CSS-animation</h1>
    </header>
    <main>
        <section>
            <h2>Vad är CSS-animation?</h2>
            <p>CSS-animationer gör det möjligt att skapa visuella effekter utan att använda JavaScript.
                Här är exempel:</p>
        </section>
        <section>
            <h2>Exempel 1:</h2>
            <p></p>
            <div class="example">
                <div class="example-box" style="transition: transform 0.5s;" onmouseover="this.style.transform='scale(1.5)'" onmouseout="this.style.transform='scale(1)'"></div>
            </div>
        </section>
        <section>
            <h2>Exempel 2:</h2>
            <p></p>
            <div class="example">
                <div class="example-box animate"></div>
            </div>
        </section>
    </main>
</body>
</html>
